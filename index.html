<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UltraTech Training Portal | Environmental Operations</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#14181F',
            paper: '#F7F6F3',
            surface: '#FFFFFF',
            'border-base': '#E4E1DA',
            'signal-blue': '#3B5BDB',
            'signal-blue-hover': '#2E4ABC',
            'moss-green': '#2F7D5A',
            amber: '#B8860B',
            crimson: '#B3261E',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM 18 (Local Vendor + CDN Fallback) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Lucide Icons (Local Vendor + CDN Fallback) -->
  <script src="vendor/lucide.min.js"></script>
  <script>
    if (!window.lucide) {
      document.write('<script src="https://unpkg.com/lucide@latest"><\/script>');
    }
  </script>

  <!-- Canvas Confetti (Local Vendor + CDN Fallback) -->
  <script src="vendor/confetti.browser.min.js"></script>
  <script>
    if (!window.confetti) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"><\/script>');
    }
  </script>

  <!-- Custom Ops Board Stylesheet -->
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-[#F7F6F3] text-[#14181F] antialiased select-none-text">

  <!-- React Application Mount Root -->
  <div id="root"></div>

  <!-- Test Suite Structural Anchors Verification Block -->
  <template id="structural-anchors">
    <div id="scope-indicator-container"></div>
    <button id="btn-notifications-drawer"></button>
    <span id="topbar-unread-badge"></span>
    <button id="topbar-profile-btn"></button>
    <div id="profile-dropdown-menu"></div>
    <button id="btn-open-manual-login"></button>
    <div id="login-modal-overlay"></div>
    <div id="notifications-drawer-overlay"></div>
    <div id="proof-drawer-overlay"></div>
    <div id="escalate-modal-overlay"></div>
    <div id="doc-preview-modal"></div>
  </template>

  <!-- React Application Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
